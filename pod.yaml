apiVersion: v1
kind: Pod

metadata:
  name: nginx-pod
  namespace: default

spec:
  containers:
  - name: nginx
    image: nginx:latest
    ports:
    - containerPort: 80
    volumeMounts:
    - name: azure-volume
      mountPath: /usr/share/nginx/html
  volumes:
  - name: azure-volume
    persistentVolumeClaim:
      claimName: azurefile-pvc